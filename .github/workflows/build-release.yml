name: Build Release

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android APK'
        required: false
        default: true
        type: boolean
      build_desktop_linux:
        description: 'Build Linux Desktop (Deb)'
        required: false
        default: true
        type: boolean
      build_desktop_windows:
        description: 'Build Windows Desktop (MSI)'
        required: false
        default: true
        type: boolean

jobs:
  build-android:
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;36.1.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Android Release APK
        run: ./gradlew :composeApp:assembleRelease

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: composeApp/build/outputs/apk/release/composeApp-release.apk
          if-no-files-found: error

  build-desktop-linux:
    if: ${{ inputs.build_desktop_linux }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Linux Desktop Package
        run: ./gradlew :composeApp:packageReleaseDeb

      - name: Upload Linux Package
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-deb
          path: composeApp/build/compose/binaries/main-release/deb/*.deb
          if-no-files-found: error

  build-desktop-windows:
    if: ${{ inputs.build_desktop_windows }}
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Windows Desktop Package
        run: ./gradlew :composeApp:packageReleaseMsi

      - name: Upload Windows Package
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-msi
          path: composeApp/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: error
