#Gradle
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4G"
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.parallel=true
#Kotlin
kotlin.code.style=official
kotlin.js.webpack.major.version=4
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 legacy escape hatches: keep KMP + com.android.application working. BOTH are
# required (dropping either hard-fails Kotlin plugin application) until the project migrates
# per https://kotl.in/kmp-project-structure-migration — there is no direct KMP replacement
# for com.android.application:
#   1. Extract the Android entry point into a new androidApp module (com.android.application;
#      entry-point sources move from composeApp/src/androidMain, expect/actual stay in composeApp)
#   2. Switch composeApp to com.android.kotlin.multiplatform.library, configure it via
#      kotlin.androidLibrary {} instead of androidTarget {}, and drop the top-level android {} block
#   3. Remove android.builtInKotlin=false and android.newDsl=false
# AGP 10 (2H 2026) will remove these hatches — the migration above must land before then.
android.builtInKotlin=false
android.newDsl=false
# Suppress AGP deprecation warnings for the legacy variant API (applicationVariants in
# :baselineprofile, testVariants/unitTestVariants in :composeApp). The callers are inside the
# Kotlin Gradle plugin's AGP integration (KotlinAndroidPlugin / KotlinAndroidSourceSets), not
# this project's build scripts; these warnings disappear with the migration above (or when
# AGP 10 removes the legacy API entirely).
android.sync.suppressAgpWarnings=DEPRECATED_DSL
#Compose
org.jetbrains.compose.experimental.jscanvas.enabled=true
org.jetbrains.compose.experimental.macos.enabled=true
compose.desktop.verbose=true
compose.useMavenLocal=false
kotlin.native.ignoreDisabledTargets=true
#KMM
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.disableCompilerDaemon=true
#Kapt
kapt.use.k2=true
kapt.classloaders.cache.size=5
kapt.include.compile.classpath=false
kapt.verbose=true
kapt.use.worker.api=true
xcodeproj=./resources/demo/iosApp
